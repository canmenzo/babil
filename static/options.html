<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title data-i18n="options_title"></title>
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1 data-i18n="settings"></h1>
    <p class="muted" data-i18n="options_intro"></p>

    <div class="preview" id="preview">
      <div class="scene"></div>
      <div class="box" id="previewBox"></div>
    </div>

    <div class="grid">
      <section class="card" data-track="trans">
        <h2 data-i18n="trans_track"></h2>
      </section>
      <section class="card" data-track="orig">
        <h2 data-i18n="orig_track"></h2>
      </section>
      <section class="card">
        <h2 data-i18n="general"></h2>
        <label class="check"><input type="checkbox" data-key="showOriginal"> <span data-i18n="show_original"></span></label>
        <label class="check"><input type="checkbox" data-key="originalFirst"> <span data-i18n="original_first"></span></label>
        <label class="field"><span data-i18n="edge"></span> <select data-key="edge"></select></label>
        <label class="field"><span data-i18n="position"></span> <span class="range"><input type="range" min="0" max="85" step="1" data-key="position"><output></output></span></label>
        <label class="field"><span data-i18n="cues_label"></span> <span class="range"><input type="range" min="1" max="6" step="1" data-key="cues"><output></output></span></label>
        <label class="check"><input type="checkbox" data-key="instant"> <span data-i18n="instant"></span></label>
        <label class="field"><span data-i18n="hold"></span> <span class="range"><input type="range" min="1" max="10" step="0.5" data-key="hold"><output></output></span></label>
        <label class="check"><input type="checkbox" data-key="scaleWithVideo"> <span data-i18n="scale_with_video"></span></label>
        <button id="reset" data-i18n="reset"></button>
      </section>
      <section class="card">
        <h2 data-i18n="read_aloud"></h2>
        <label class="check"><input type="checkbox" data-key="tts"> <span data-i18n="tts"></span></label>
        <div class="personas" id="personas"></div>
        <label class="field"><span data-i18n="voice"></span> <select data-key="ttsVoice"></select></label>
        <label class="field"><span data-i18n="rate"></span> <span class="range"><input type="range" min="0.5" max="2" step="0.1" data-key="ttsRate"><output></output></span></label>
        <label class="check" id="ttsDuck"><input type="checkbox" data-key="ttsDuck"> <span data-i18n="duck"></span></label>
      </section>
    </div>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
