<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <header>
    <img src="icons/48.png" alt="" width="24" height="24">
    <h1>Babil</h1>
  </header>

  <div id="status" class="status">Hazır</div>
  <div id="bar" class="bar" hidden><div></div></div>
  <div id="latency" class="muted small"></div>

  <button id="toggle" class="primary">Altyazıyı başlat</button>

  <div id="pairs"></div>

  <div class="row">
    <label class="field">Konuşulan dil <select id="source"></select></label>
    <span class="arrow">→</span>
    <label class="field">Çeviri dili <select id="target"></select></label>
  </div>

  <label class="field">Model
    <select id="model">
      <option value="auto">Otomatik, önerilen (GPU: small, CPU: base)</option>
      <option value="tiny">En hızlı (Whisper tiny, ~45 MB)</option>
      <option value="base">Hızlı (Whisper base, ~90 MB)</option>
      <option value="small">Dengeli (Whisper small, ~250 MB)</option>
      <option value="turbo">En iyi kalite (large-v3 turbo, ~700 MB, güçlü GPU)</option>
    </select>
  </label>

  <label class="check"><input type="checkbox" id="showOriginal"> Orijinal altyazıyı da göster</label>

  <label class="field">Ekranda kalan cümle sayısı
    <select id="cues">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
      <option value="6">6</option>
    </select>
  </label>

  <p id="restartHint" class="muted small" hidden>Dil ve model değişikliği yeniden başlatınca geçerli olur.</p>

  <footer>
    <a href="#" id="openOptions">Altyazı görünüm ayarları</a>
    <span class="muted small">Kısayol: Alt+Shift+T</span>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
