<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <header>
    <img src="icons/48.png" alt="" width="24" height="24">
    <h1>Babil</h1>
  </header>

  <div id="status" class="status">Hazır</div>
  <div id="bar" class="bar" hidden><div></div></div>
  <div id="latency" class="muted small"></div>

  <button id="toggle" class="primary">Altyazıyı başlat</button>

  <div id="pairs"></div>

  <div id="update" class="pair" hidden>
    <strong id="updateTitle"></strong>
    <span class="small">Zip'i indir, mevcut Babil klasörünün üstüne çıkar, sonra aşağıdaki butona bas. Ayarlar ve indirilmiş modeller korunur.</span>
    <a id="updateZip" class="button primary" target="_blank">Zip'i indir</a>
    <button id="updateReload">Çıkardım, Babil'i yenile</button>
    <a id="updateNotes" class="small" target="_blank">Neler yeni?</a>
  </div>

  <div class="row">
    <label class="field">Konuşulan dil <select id="source"></select></label>
    <span class="arrow">→</span>
    <label class="field">Çeviri dili <select id="target"></select></label>
  </div>

  <label class="field">Model
    <select id="model"></select>
  </label>
  <p id="modelHint" class="muted small hint"></p>

  <label class="check"><input type="checkbox" id="showOriginal"> Orijinal altyazıyı da göster</label>

  <label class="field">Ekranda kaç cümle görünsün
    <select id="cues">
      <option value="1">Sadece son cümle</option>
      <option value="2">Son 2 cümle</option>
      <option value="3">Son 3 cümle</option>
      <option value="4">Son 4 cümle</option>
      <option value="5">Son 5 cümle</option>
      <option value="6">Son 6 cümle</option>
    </select>
  </label>

  <footer>
    <a href="#" id="openOptions">Altyazı görünüm ayarları</a>
    <span class="muted small">Kısayol: Alt+Shift+T</span>
  </footer>
  <div class="muted small version"><span id="version"></span> · <a href="#" id="checkUpdate">Güncellemeleri denetle</a></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
