<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="icons/32.png">
<link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <header>
    <img src="icons/48.png" alt="" width="24" height="24">
    <h1>Babil</h1>
  </header>

  <div id="status" class="status"></div>
  <div id="bar" class="bar" hidden><div></div></div>
  <div id="latency" class="muted small"></div>

  <button id="toggle" class="primary"></button>

  <div id="pairs"></div>

  <div class="row">
    <label class="field"><span data-i18n="source_label"></span> <select id="source"></select></label>
    <span class="arrow">→</span>
    <label class="field"><span data-i18n="target_label"></span> <select id="target"></select></label>
  </div>

  <div class="field">
    <span data-i18n="model_label"></span>
    <button type="button" id="modelToggle" class="model-toggle" aria-controls="modelList">
      <span id="modelName"></span>
      <span id="modelState" class="model-state"></span>
      <span id="modelCaret" class="model-caret"></span>
    </button>
  </div>
  <div id="modelList" class="model-list" hidden>
    <div id="modelRows"></div>
    <p class="muted small model-note" data-i18n="model_speed_note"></p>
  </div>

  <label class="check"><input type="checkbox" id="showOriginal"> <span data-i18n="show_original_too"></span></label>
  <label class="check"><input type="checkbox" id="tts"> <span data-i18n="tts"></span></label>
  <label class="field" id="personaField"><span data-i18n="voice"></span> <select id="ttsPersona"></select></label>
  <div id="ttsHint" class="hint tts-hint">
    <span id="ttsHintText" class="muted small"></span>
    <div id="ttsBar" class="bar" hidden><div></div></div>
    <button id="ttsDownload" data-i18n="tts_download_voice" hidden></button>
  </div>

  <label class="field"><span data-i18n="cues_label"></span>
    <select id="cues"></select>
  </label>

  <footer>
    <button type="button" id="openOptions" class="subtle" data-i18n="settings"></button>
    <span class="shortcut muted small"><span data-i18n="shortcut"></span><kbd>Alt+Shift+T</kbd></span>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
