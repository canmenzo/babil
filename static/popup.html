<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <header>
    <img src="icons/48.png" alt="" width="24" height="24">
    <h1>Babil</h1>
  </header>

  <div id="status" class="status"></div>
  <div id="bar" class="bar" hidden><div></div></div>
  <div id="latency" class="muted small"></div>

  <button id="toggle" class="primary"></button>

  <div id="pairs"></div>

  <div id="update" class="pair" hidden>
    <strong id="updateTitle"></strong>
    <span class="small" data-i18n="update_hint"></span>
    <a id="updateZip" class="button primary" target="_blank" data-i18n="update_zip"></a>
    <button id="updateReload" data-i18n="update_reload"></button>
    <a id="updateNotes" class="small" target="_blank" data-i18n="update_notes"></a>
  </div>

  <div class="row">
    <label class="field"><span data-i18n="source_label"></span> <select id="source"></select></label>
    <span class="arrow">→</span>
    <label class="field"><span data-i18n="target_label"></span> <select id="target"></select></label>
  </div>

  <label class="field"><span data-i18n="model_label"></span>
    <select id="model"></select>
  </label>
  <p id="modelHint" class="muted small hint"></p>

  <label class="check"><input type="checkbox" id="showOriginal"> <span data-i18n="show_original_too"></span></label>
  <label class="check"><input type="checkbox" id="tts"> <span data-i18n="tts"></span></label>
  <label class="field" id="personaField"><span data-i18n="voice"></span> <select id="ttsPersona"></select></label>

  <label class="field"><span data-i18n="cues_label"></span>
    <select id="cues"></select>
  </label>

  <footer>
    <button type="button" id="openOptions" class="subtle" data-i18n="settings"></button>
    <span class="shortcut muted small"><span data-i18n="shortcut"></span><kbd>Alt+Shift+T</kbd></span>
  </footer>
  <div class="muted small version"><span id="version"></span> · <a href="#" id="checkUpdate" data-i18n="check_update"></a></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
